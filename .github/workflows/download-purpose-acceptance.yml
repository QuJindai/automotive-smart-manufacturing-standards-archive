name: Download Purpose Acceptance

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Staging checks admission; production submits three real Drive tests.
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Exercise deployed purpose-aware admission
        env:
          ACCEPTANCE_ENVIRONMENT: ${{ inputs.environment }}
          MCP_PRIVATE_PATH: ${{ secrets.DOWNLOAD_MCP_PRIVATE_PATH }}
        run: python scripts/download_purpose_acceptance.py
