name: OpenSTD Session Reuse Clean Probe
on:
  push:
    branches: [test/openstd-session-reuse-clean-20260902]
    paths: ['ops/openstd-session-reuse.trigger']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/openstd-session-reuse-clean-20260902
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/openstd_session_reuse_probe.py
