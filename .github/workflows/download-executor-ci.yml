name: Download Executor CI

# Generic transfer integrity and real browser fallback regression gates.
on:
  push:
    paths:
      - 'scripts/download_executor.py'
      - 'scripts/download_browser.mjs'
      - 'tests/download_executor/**'
      - 'tests/memory_export/**'
      - 'tests/download_mcp/**'
      - 'tests/download_drive/**'
      - 'supabase/functions/_shared/memory_export_core.ts'
      - 'supabase/functions/gmail-memory-export/**'
      - 'supabase/functions/download-mcp/**'
      - 'supabase/functions/download-drive/**'
      - '.github/workflows/download-executor.yml'
      - '.github/workflows/download-executor-ci.yml'
  pull_request:
    paths:
      - 'scripts/download_executor.py'
      - 'scripts/download_browser.mjs'
      - 'tests/download_executor/**'
      - 'tests/memory_export/**'
      - 'tests/download_mcp/**'
      - 'tests/download_drive/**'
      - 'supabase/functions/_shared/memory_export_core.ts'
      - 'supabase/functions/gmail-memory-export/**'
      - 'supabase/functions/download-mcp/**'
      - 'supabase/functions/download-drive/**'
      - '.github/workflows/download-executor.yml'
      - '.github/workflows/download-executor-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run executor unit contracts
        run: python -m unittest discover -s tests/download_executor -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Gmail memory export contracts
        run: node --test tests/memory_export/memory_export_core.test.mjs
      - name: Run Supabase download control contracts
        run: node --test tests/download_mcp/*.test.mjs tests/download_drive/*.test.mjs

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install real browser test runtime
        run: |
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Exercise HTTPS source failure and real Chromium fallback
        env:
          DOWNLOAD_BROWSER_INTEGRATION: '1'
        run: python -m unittest tests.download_executor.test_browser_integration -v

