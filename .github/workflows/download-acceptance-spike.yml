name: Download Acceptance Spike

on:
  push:
    paths:
      - '.github/workflows/download-acceptance-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: MCP protocol acceptance
        shell: bash
        run: |
          set -euo pipefail
          URL='https://ezvfqrhzucjvkwnnbjux.supabase.co/functions/v1/download-mcp-acceptance'
          mkdir -p evidence
          curl -fsS -X POST "$URL" -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-acceptance","version":"1"}}}' > evidence/mcp_initialize.json
          curl -fsS -X POST "$URL" -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' > evidence/mcp_tools.json
          curl -fsS -X POST "$URL" -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"start_download","arguments":{"request":"acceptance probe","destination":"Google Drive"}}}' > evidence/mcp_call.json
          python - <<'PY'
          import json
          a=json.load(open('evidence/mcp_initialize.json'))
          b=json.load(open('evidence/mcp_tools.json'))
          c=json.load(open('evidence/mcp_call.json'))
          assert a['result']['protocolVersion']=='2025-06-18'
          assert a['result']['serverInfo']['name'].startswith('下载')
          tools=b['result']['tools']
          assert any(t['name']=='start_download' for t in tools)
          s=c['result']['structuredContent']
          assert s['status']=='accepted' and s['mode']=='delegated'
          assert 'github.download.execute' in s['capabilities']
          assert 'drive.archive' in s['capabilities']
          print('MCP_ACCEPTANCE=PASS')
          PY

      - name: Dataset direct-download acceptance
        shell: bash
        run: |
          set -euo pipefail
          url='https://huggingface.co/datasets/lhoestq/demo1/resolve/main/data/train.csv?download=true'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 120 -o evidence/dataset_train.csv "$url"
          test -s evidence/dataset_train.csv
          head -n 1 evidence/dataset_train.csv | grep -q 'package_name'
          sha256sum evidence/dataset_train.csv > evidence/dataset.sha256
          echo DATASET_ACCEPTANCE=PASS

      - name: GGUF range and identity acceptance
        shell: bash
        run: |
          set -euo pipefail
          url='https://huggingface.co/rbai86/tinyllama-GGUF/resolve/main/tinyllama.Q4_K_M.gguf?download=true'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 --range 0-4095 -o evidence/gguf_head.bin "$url"
          python - <<'PY'
          from pathlib import Path
          p=Path('evidence/gguf_head.bin')
          b=p.read_bytes()
          assert len(b)>=4, len(b)
          assert b[:4]==b'GGUF', b[:16]
          print('GGUF_MAGIC=PASS bytes=',len(b))
          PY
          sha256sum evidence/gguf_head.bin > evidence/gguf_head.sha256

      - name: Paper PDF acceptance
        shell: bash
        run: |
          set -euo pipefail
          url='https://arxiv.org/pdf/1706.03762'
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 180 -A 'Mozilla/5.0 DownloadAcceptance/1.0' -o evidence/paper.pdf "$url"
          test "$(head -c 5 evidence/paper.pdf)" = '%PDF-'
          test "$(wc -c < evidence/paper.pdf)" -gt 1000
          sha256sum evidence/paper.pdf > evidence/paper.sha256
          echo PAPER_ACCEPTANCE=PASS

      - name: Browser-session acquisition acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > browser.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const landing='https://www.dhs.gov/science-and-technology/publication/pnt-best-practices-supporting-critical-infrastructure';
          const pdf='https://www.dhs.gov/sites/default/files/2025-02/25_0220_st_pnt_best_practices_ci.pdf';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'});
          const page=await ctx.newPage();
          await page.goto(landing,{waitUntil:'domcontentloaded',timeout:45000}).catch(()=>null);
          const r=await page.request.get(pdf,{headers:{referer:landing,accept:'application/pdf,*/*;q=0.8'},timeout:45000});
          const body=await r.body();
          if(!r.ok() || body.length<1000 || body.subarray(0,5).toString()!=='%PDF-') throw new Error(`bad browser fetch status=${r.status()} bytes=${body.length}`);
          fs.writeFileSync('evidence/browser.pdf',body);
          fs.writeFileSync('evidence/browser_status.txt',`status=${r.status()} bytes=${body.length}\n`);
          await browser.close();
          console.log('BROWSER_ACCEPTANCE=PASS',r.status(),body.length);
          EOF
          node browser.mjs
          sha256sum evidence/browser.pdf > evidence/browser.sha256

      - name: Summarize
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          out={'status':'PASS','files':{}}
          for p in sorted(Path('evidence').iterdir()):
              if p.is_file():
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  out['files'][p.name]={'bytes':p.stat().st_size,'sha256':h}
          Path('evidence/ACCEPTANCE.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(Path('evidence/ACCEPTANCE.json').read_text())
          PY

      - name: Upload evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: download-acceptance-${{ github.run_id }}
          path: |
            evidence/ACCEPTANCE.json
            evidence/*.json
            evidence/*.sha256
            evidence/*status.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
