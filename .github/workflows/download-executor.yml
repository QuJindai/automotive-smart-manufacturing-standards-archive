name: Download Executor

on:
  push:
    branches: [main]
    paths:
      - '.download/jobs/**'
  schedule:
    # Offset the five-minute poll away from GitHub's busiest cron boundaries.
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: download-executor-${{ github.sha }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Request GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          raw=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=download-mcp")
          token=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$raw")
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Resolve descriptor or claim queue
        id: descriptor
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            path=$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$GITHUB_SHA" | grep '^\.download/jobs/.*\.json$' | head -n 1 || true)
            if [ -z "$path" ]; then
              echo 'found=false' >> "$GITHUB_OUTPUT"
              echo 'DOWNLOAD_DESCRIPTOR=REMOVED'
              exit 0
            fi
            id=$(python - "$path" <<'PY'
          import json, sys
          from scripts.download_executor import validate_descriptor
          print(validate_descriptor(json.load(open(sys.argv[1],encoding='utf-8'))))
          PY
            )
            echo "path=$path" >> "$GITHUB_OUTPUT"
          else
            code=$(curl -sS -o claim.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              'https://ezvfqrhzucjvkwnnbjux.supabase.co/functions/v1/download-mcp/executor/claim')
            if [ "$code" = '204' ]; then
              echo 'found=false' >> "$GITHUB_OUTPUT"
              echo 'DOWNLOAD_QUEUE=EMPTY'
              exit 0
            fi
            test "$code" = '200'
            id=$(python -c 'import json; print(json.load(open("claim.json"))["download_id"])')
            rm -f claim.json
          fi
          echo 'found=true' >> "$GITHUB_OUTPUT"
          echo "download_id=$id" >> "$GITHUB_OUTPUT"
          echo "DOWNLOAD_ID=$id"

      - name: Fetch secret job payload
        if: steps.descriptor.outputs.found == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DOWNLOAD_ID: ${{ steps.descriptor.outputs.download_id }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://ezvfqrhzucjvkwnnbjux.supabase.co/functions/v1/download-mcp/executor/job/$DOWNLOAD_ID" \
            -o job.json
          python - <<'PY'
          import json
          j=json.load(open('job.json'))
          assert j.get('download_id')
          assert isinstance(j.get('assets'),list) and j['assets']
          print('EXECUTOR_JOB_FETCH=PASS',j['download_id'],len(j['assets']))
          PY

      - name: Acquire large-file Drive sessions
        if: steps.descriptor.outputs.found == 'true'
        id: drive
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DOWNLOAD_ID: ${{ steps.descriptor.outputs.download_id }}
        run: |
          set -euo pipefail
          BASE='https://ezvfqrhzucjvkwnnbjux.supabase.co/functions/v1/download-drive'
          code=$(curl -sS -o drive-sessions.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$BASE/executor/sessions/$DOWNLOAD_ID")
          if [ "$code" = '200' ]; then
            python - <<'PY'
          import json
          response=json.load(open('drive-sessions.json'))
          sessions=response.get('upload_sessions') or {}
          assert isinstance(sessions,dict)
          job=json.load(open('job.json'))
          job['upload_sessions']=sessions
          json.dump(job,open('job.json','w'),ensure_ascii=False,separators=(',',':'))
          open('mask-sessions.txt','w').write('\n'.join(str(x) for x in sessions.values() if x))
          print('DRIVE_SESSION_STATUS=READY',len(sessions))
          PY
            while IFS= read -r session; do
              [ -z "$session" ] || echo "::add-mask::$session"
            done < mask-sessions.txt
            rm -f mask-sessions.txt drive-sessions.json
            echo 'status=ready' >> "$GITHUB_OUTPUT"
          elif [ "$code" = '409' ]; then
            python - <<'PY'
          import json
          response=json.load(open('drive-sessions.json'))
          assert response.get('code')=='AUTH_REQUIRED', response
          assert response.get('scope')=='https://www.googleapis.com/auth/drive.file', response
          text=json.dumps(response).lower()
          for secret in ('refresh_token','access_token','client_secret','ciphertext','session_url','upload_sessions'):
              assert secret not in text, secret
          print('DRIVE_SESSION_STATUS=AUTH_REQUIRED')
          PY
            rm -f drive-sessions.json
            echo 'status=auth_required' >> "$GITHUB_OUTPUT"
          else
            echo "DRIVE_SESSION_STATUS=ERROR_HTTP_$code"
            rm -f drive-sessions.json
            exit 1
          fi

      - name: Preflight large-file Drive routing
        if: steps.descriptor.outputs.found == 'true'
        id: large
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from scripts.download_executor import redact_url, source_size
          j=json.load(open('job.json'))
          limit=int(j.get('small_limit_bytes') or 100*1024*1024)
          sessions=j.get('upload_sessions') or {}
          blocked=[]
          for a in j.get('assets',[]):
              if not isinstance(a,dict):
                  continue
              size=int(a.get('expected_size_bytes') or 0)
              if not size:
                  size=source_size(str(a.get('source_url') or '')) or 0
                  if size:
                      a['expected_size_bytes']=size
              aid=str(a.get('asset_id') or '')
              if size>limit and not sessions.get(aid):
                  blocked.append((a,size))
          json.dump(j,open('job.json','w'),ensure_ascii=False,separators=(',',':'))
          if blocked:
              assets=[]
              for a,size in blocked:
                  assets.append({
                      'asset_id':str(a.get('asset_id') or ''),
                      'filename':str(a.get('filename') or 'download.bin'),
                      'status':'FAIL','bytes':0,'sha256':None,
                      'method':'drive-resumable-required',
                      'error':f'DIRECT_DRIVE_SESSION_REQUIRED:{size}',
                      'drive_ref':None,'artifact_path':None,
                      'source_url_redacted':redact_url(str(a.get('source_url') or '')),
                  })
              json.dump({'download_id':j.get('download_id'),'assets':assets,'drive_refs':[],
                         'pass_count':0,'fail_count':len(assets),'auth_required':True},
                        open('result.json','w'),ensure_ascii=False,indent=2)
              open('large.env','w').write('blocked=true\n')
              print('LARGE_ROUTE=AUTH_REQUIRED',[(x[0].get('filename'),x[1]) for x in blocked])
          else:
              open('large.env','w').write('blocked=false\n')
              print('LARGE_ROUTE=READY')
          PY
          cat large.env >> "$GITHUB_OUTPUT"

      - name: Detect browser fallback requirement
        if: steps.descriptor.outputs.found == 'true'
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          required=$(python - <<'PY'
          import json
          from scripts.download_executor import fallback_methods
          j=json.load(open('job.json'))
          print('true' if any('browser' in fallback_methods(a) for a in j.get('assets',[]) if isinstance(a,dict)) else 'false')
          PY
          )
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "BROWSER_REQUIRED=$required"

      - name: Install browser runtime
        if: steps.descriptor.outputs.found == 'true' && steps.large.outputs.blocked != 'true' && steps.browser.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          echo 'PLAYWRIGHT_BROWSER=READY'

      - name: Execute download
        if: steps.descriptor.outputs.found == 'true'
        id: execute
        shell: bash
        env:
          LARGE_BLOCKED: ${{ steps.large.outputs.blocked }}
        run: |
          set +e
          if [ "$LARGE_BLOCKED" = 'true' ]; then
            echo 'exit_code=3' >> "$GITHUB_OUTPUT"
            test -f result.json
            exit 0
          fi
          rm -rf out result.json
          mkdir -p out
          python scripts/download_executor.py --job job.json --out out --result result.json
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          test -f result.json
          exit 0

      - name: Upload small-file transfer artifact
        if: steps.descriptor.outputs.found == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: download-${{ steps.descriptor.outputs.download_id }}-${{ github.run_id }}
          path: |
            out/
            result.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0

      - name: Verify direct Drive uploads
        if: steps.descriptor.outputs.found == 'true' && steps.large.outputs.blocked != 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DOWNLOAD_ID: ${{ steps.descriptor.outputs.download_id }}
        run: |
          set -euo pipefail
          count=$(python - <<'PY'
          import json
          data=json.load(open('result.json'))
          print(len(data.get('drive_refs') or []))
          PY
          )
          if [ "$count" = '0' ]; then
            echo 'DIRECT_DRIVE_VERIFY=NOT_APPLICABLE'
            exit 0
          fi
          # Keep each Edge request bounded even when a job contains many files.
          for ((offset=0; offset<count; offset+=20)); do
          python - "$offset" <<'PY'
          import json, sys
          data=json.load(open('result.json'))
          offset=int(sys.argv[1])
          open('drive-verify-request.json','w').write(json.dumps({'drive_refs':data['drive_refs'][offset:offset+20]},separators=(',',':')))
          PY
          # Refresh the OIDC identity after downloading large files.
          code=OIDC_UNAVAILABLE
          if token=$(curl -fsS --retry 2 --connect-timeout 15 --max-time 45 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=download-mcp" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])'); then
            echo "::add-mask::$token"
            code=$(curl -sS --retry 2 --connect-timeout 15 --max-time 90 -o "drive-verify-result-$offset.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              --data-binary @drive-verify-request.json \
              "https://ezvfqrhzucjvkwnnbjux.supabase.co/functions/v1/download-drive/executor/verify/$DOWNLOAD_ID") || true
          fi
          echo "DIRECT_DRIVE_VERIFY_HTTP=$code OFFSET=$offset"
          done
          python - <<'PY'
          import glob, json
          from scripts.download_executor import apply_drive_verification
          data=json.load(open('result.json'))
          verified={'verified':True,'drive_refs':[]}
          for path in glob.glob('drive-verify-result*.json'):
              try:
                  batch=json.load(open(path))
              except (ValueError, OSError):
                  continue
              if isinstance(batch,dict) and batch.get('verified') is True and isinstance(batch.get('drive_refs'),list):
                  verified['drive_refs'].extend(batch['drive_refs'])
          data=apply_drive_verification(data,verified)
          json.dump(data,open('result.json','w'),ensure_ascii=False,indent=2)
          print('DIRECT_DRIVE_VERIFY=' + ('PASS' if data['drive_verified'] else 'FAIL'),len(data['drive_refs']))
          PY
          rm -f drive-verify-request.json drive-verify-result*.json

      - name: Submit normalized result
        if: steps.descriptor.outputs.found == 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DOWNLOAD_ID: ${{ steps.descriptor.outputs.download_id }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          EXECUTOR_EXIT: ${{ steps.execute.outputs.exit_code }}
        run: |
          set -euo pipefail
          endpoint=$(python - <<'PY'
          import json, os
          data=json.load(open('result.json'))
          data['artifact']={
            'artifact_id': os.environ.get('ARTIFACT_ID',''),
            'artifact_url': os.environ.get('ARTIFACT_URL',''),
            'run_id': os.environ.get('GITHUB_RUN_ID',''),
          }
          data['executor_exit_code']=max(int(data.get('executor_exit_code',0)),int(os.environ.get('EXECUTOR_EXIT','0')))
          open('result-submit.json','w').write(json.dumps(data,separators=(',',':')))
          print('download-mcp-large-result' if data.get('auth_required') is True else 'download-mcp')
          PY
          )
          echo "CONTROL_RESULT_ENDPOINT=$endpoint"
          token=$(curl -fsS --retry 2 --connect-timeout 15 --max-time 45 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=download-mcp" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$token"
          curl -fsS --retry 2 --connect-timeout 15 --max-time 90 -X POST \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            --data-binary @result-submit.json \
            "https://ezvfqrhzucjvkwnnbjux.supabase.co/functions/v1/$endpoint/executor/result/$DOWNLOAD_ID" \
            > control-result.json
          python - <<'PY'
          import json
          r=json.load(open('control-result.json'))
          assert r.get('download_id')
          print('EXECUTOR_RESULT_SUBMIT=PASS',r['download_id'],r.get('status'))
          PY

      - name: Continue draining queued downloads
        if: always() && steps.descriptor.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run download-executor.yml --ref main
          echo 'DOWNLOAD_QUEUE_CONTINUATION=DISPATCHED'

