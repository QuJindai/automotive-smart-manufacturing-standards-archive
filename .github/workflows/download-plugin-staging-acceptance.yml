name: Download Plugin Staging Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_URL: https://ezvfqrhzucjvkwnnbjux.supabase.co/functions/v1/download-mcp-staging
      MCP_PRIVATE_PATH: ${{ secrets.DOWNLOAD_MCP_PRIVATE_PATH }}
    steps:
      - name: Assert staging MCP contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MCP_PRIVATE_PATH"
          URL="${BASE_URL}${MCP_PRIVATE_PATH}"
          curl -fsS -X POST "$URL" -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"download-ci","version":"1"}}}' > init.json
          curl -fsS -X POST "$URL" -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' > tools.json
          python - <<'PY'
          import json
          init=json.load(open('init.json'))
          tools=json.load(open('tools.json'))
          assert init['result']['protocolVersion']=='2025-06-18'
          assert init['result']['serverInfo']=={'name':'下载','version':'0.5.0-github-app-dispatch'}
          definitions=tools['result']['tools']
          names=[item['name'] for item in definitions]
          assert names==[
              'start_download','resolve_download_sources','get_download',
              'resume_download','retry_download','finalize_download',
          ], names
          assert all(item.get('outputSchema',{}).get('type')=='object' for item in definitions)
          print('DOWNLOAD_STAGING_MCP_CONTRACT=PASS')
          PY

  state-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BASE_URL: https://ezvfqrhzucjvkwnnbjux.supabase.co/functions/v1/download-mcp-staging
      MCP_PRIVATE_PATH: ${{ secrets.DOWNLOAD_MCP_PRIVATE_PATH }}
    steps:
      - name: Assert queued jobs, resolution and policy guards
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MCP_PRIVATE_PATH"
          URL="${BASE_URL}${MCP_PRIVATE_PATH}"
          call() { curl -fsS -X POST "$URL" -H 'content-type: application/json' --data "$1"; }

          call '{"jsonrpc":"2.0","id":10,"method":"tools/call","params":{"name":"start_download","arguments":{"request":"https://arxiv.org/pdf/1706.03762","destination":"Google Drive/下载插件预发布"}}}' > direct.json
          python - <<'PY'
          import json
          result=json.load(open('direct.json'))['result']
          assert not result.get('isError'), result
          job=result['structuredContent']
          assert job['status']=='QUEUED', job
          assert job['next_action']['action']=='WAIT_EXECUTOR', job
          assert job['destination']=='Google Drive/下载插件预发布'
          print('DOWNLOAD_DIRECT_QUEUE=PASS',job['download_id'])
          PY

          call '{"jsonrpc":"2.0","id":11,"method":"tools/call","params":{"name":"start_download","arguments":{"request":"IDTA AAS Part 1 Metamodel","destination":"Google Drive/下载插件预发布"}}}' > resolving.json
          python - <<'PY'
          import json
          payload=json.load(open('resolving.json'))['result']['structuredContent']
          assert payload['status']=='RESOLVING', payload
          request={
              'jsonrpc':'2.0','id':12,'method':'tools/call',
              'params':{
                  'name':'resolve_download_sources',
                  'arguments':{
                      'download_id':payload['download_id'],
                      'sources':[{
                          'requested_item':'IDTA AAS Part 1 Metamodel',
                          'source_url':'https://industrialdigitaltwin.org/wp-content/uploads/2025/03/IDTA-01001-3-0-2_SpecificationAssetAdministrationShell_Part1_Metamodel.pdf',
                          'filename':'IDTA-01001-3-0-2_SpecificationAssetAdministrationShell_Part1_Metamodel.pdf',
                          'license_class':'open-specification',
                          'official':True,
                          'redistributable':True,
                      }],
                      'unresolved':[],
                  },
              },
          }
          json.dump(request,open('resolve-request.json','w'),ensure_ascii=False,separators=(',',':'))
          PY
          curl -fsS -X POST "$URL" -H 'content-type: application/json' \
            --data-binary @resolve-request.json > resolved.json
          python - <<'PY'
          import json
          start=json.load(open('resolving.json'))['result']['structuredContent']
          result=json.load(open('resolved.json'))['result']
          assert not result.get('isError'), result
          job=result['structuredContent']
          assert job['download_id']==start['download_id']
          assert job['status']=='QUEUED', job
          assert job['next_action']['action']=='WAIT_EXECUTOR', job
          print('DOWNLOAD_SOURCE_RESOLUTION=PASS',job['download_id'])
          PY

          call '{"jsonrpc":"2.0","id":13,"method":"tools/call","params":{"name":"start_download","arguments":{"request":"https://127.0.0.1/private"}}}' > ssrf.json
          call '{"jsonrpc":"2.0","id":14,"method":"tools/call","params":{"name":"start_download","arguments":{"request":"bypass paywall https://example.com/paid.pdf"}}}' > copyright.json
          python - <<'PY'
          import json
          for name in ('ssrf.json','copyright.json'):
              result=json.load(open(name))['result']
              assert result.get('isError') is True, (name,result)
          print('DOWNLOAD_POLICY_GUARDS=PASS')
          PY

