name: GB688 Direct PDF Probe

on:
  push:
    paths:
      - '.github/workflows/gb688-direct-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch one official GB PDF tolerating bad Content-Length
        shell: bash
        run: |
          set -euo pipefail
          hcno='8676EBC34F75CFFDF7EA4BC12517A007'
          base='https://c.gb688.cn/bzgk/gb'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          rm -f GB_15082-2008.pdf cookies.txt

          curl --http1.1 --ignore-content-length -fSL --retry 3 --retry-delay 2 \
            -H 'Accept-Encoding: identity' -A "$ua" \
            -c cookies.txt -b cookies.txt \
            "$base/showGb?type=download&hcno=$hcno" -o /tmp/gb688-landing.html || true

          curl --http1.1 --ignore-content-length -fSL --retry 3 --retry-delay 2 \
            -H 'Accept-Encoding: identity' -A "$ua" \
            -c cookies.txt -b cookies.txt \
            -e "$base/showGb?type=download&hcno=$hcno" \
            "$base/viewGb?hcno=$hcno" -o GB_15082-2008.pdf

      - name: Validate downloaded body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('GB_15082-2008.pdf')
          data=p.read_bytes()
          print(f'bytes={len(data)} magic={data[:16]!r}')
          if len(data) < 10_000:
              raise SystemExit('FAIL: response too small')
          if not data.startswith(b'%PDF-'):
              raise SystemExit('FAIL: body is not PDF')
          PY
          sha256sum GB_15082-2008.pdf

      - name: Preserve validated probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: gb688-direct-probe-ignore-length
          path: GB_15082-2008.pdf
          retention-days: 1
