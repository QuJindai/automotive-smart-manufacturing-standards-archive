name: GNSS R155 UN Documents Recovery

on:
  push:
    paths:
      - '.github/workflows/gnss-recovery-crossrunner.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  un-documents:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch R155 official UN Documents PDFs
        shell: bash
        env:
          PROXY_BASE: https://ezvfqrhzucjvkwnnbjux.supabase.co/functions/v1/gnss-official-recovery-proxy
          SUPABASE_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6dmZxcmh6dWNqdmt3bm5ianV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3ODAzNzEsImV4cCI6MjA5OTM1NjM3MX0.pGJ8QeaoEoZBmkftre5w2kesyeM_jWK3MfV3ru8LWt8
        run: |
          set -u
          mkdir -p out
          printf 'filename\ttarget\tstatus\thttp_code\tmime\tbytes\n' > out/FETCH_LOG.tsv
          fetch_proxy() {
            filename="$1"; target="$2"
            tmp="out/.${filename}.part"; dst="out/$filename"
            rm -f "$tmp" "$dst"
            code=$(curl -L --connect-timeout 15 --max-time 120 \
              -H "Authorization: Bearer $SUPABASE_ANON" \
              -H "apikey: $SUPABASE_ANON" \
              -o "$tmp" -w '%{http_code}' "$PROXY_BASE?id=$target" 2>/dev/null || true)
            mime=$(file -b --mime-type "$tmp" 2>/dev/null || true)
            bytes=$(stat -c '%s' "$tmp" 2>/dev/null || echo 0)
            magic=$(head -c 5 "$tmp" 2>/dev/null || true)
            if [ "$code" = "200" ] && [ "$magic" = "%PDF-" ] && [ "$bytes" -gt 1000 ]; then
              mv "$tmp" "$dst"
              printf '%s\t%s\tPASS\t%s\t%s\t%s\n' "$filename" "$target" "$code" "$mime" "$bytes" >> out/FETCH_LOG.tsv
            else
              printf '%s\t%s\tFAIL\t%s\t%s\t%s\n' "$filename" "$target" "$code" "$mime" "$bytes" >> out/FETCH_LOG.tsv
              rm -f "$tmp"
            fi
          }
          fetch_proxy UN_R155_Amendment2_2024.pdf r155doc2
          fetch_proxy UN_R155_Amendment3_2025.pdf r155doc3
          fetch_proxy UN_R155_LegalText_Supplement2_ECE_TRANS_WP29_2023_70.pdf r155legal2
          fetch_proxy UN_R155_LegalText_Supplement3_ECE_TRANS_WP29_2024_55.pdf r155legal3
          find out -maxdepth 1 -name '*.pdf' -type f -print0 | sort -z | xargs -0 -r sha256sum > out/SHA256SUMS.txt
          cat out/FETCH_LOG.tsv
          cat out/SHA256SUMS.txt

      - name: Upload UN Documents recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: GNSS_RECOVERY_UN_DOCUMENTS
          path: |
            out/*.pdf
            out/FETCH_LOG.tsv
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
