name: Resolve SAMR official download endpoints

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/samr_resolve.py'
      - 'official-index/samr-download-probe-batch1.json'
      - '.github/workflows/samr-resolve-official-download.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve official endpoints
        run: |
          python -m pip install -q requests
          rm -rf samr-probe-out
          python scripts/samr_resolve.py \
            --targets official-index/samr-download-probe-batch1.json \
            --out samr-probe-out
      - name: Show resolver result
        run: cat samr-probe-out/resolver-results.json
      - name: Upload metadata-only resolver result
        uses: actions/upload-artifact@v4
        with:
          name: samr-resolver-metadata-${{ github.run_id }}
          path: samr-probe-out/resolver-results.json
          retention-days: 1
          if-no-files-found: error
