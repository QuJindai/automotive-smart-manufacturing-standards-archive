name: Download Google Scope Probe
on:
  push:
    paths:
      - '.github/workflows/download-google-scope-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read OAuth scope names only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://ezvfqrhzucjvkwnnbjux.supabase.co/functions/v1/download-google-scope-probe?k=tKKThaTLoCrd8EnLdJ2e85aU1G3OiIt1'
