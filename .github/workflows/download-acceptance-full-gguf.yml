name: Download Acceptance Full GGUF

on:
  push:
    paths:
      - '.github/workflows/download-acceptance-full-gguf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-gguf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download validate and split full GGUF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/parts out/meta
          url='https://huggingface.co/rbai86/tinyllama-GGUF/resolve/main/tinyllama.Q4_K_M.gguf?download=true'
          curl -L --fail --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 900 -o out/tinyllama.Q4_K_M.gguf "$url"
          python - <<'PY'
          from pathlib import Path
          p=Path('out/tinyllama.Q4_K_M.gguf')
          assert p.read_bytes()[:4] == b'GGUF'
          assert p.stat().st_size > 500_000_000
          print('FULL_GGUF_ACCEPTANCE=PASS', p.stat().st_size)
          PY
          sha256sum out/tinyllama.Q4_K_M.gguf | sed 's#out/##' > out/meta/SHA256SUMS.txt
          stat -c '%s' out/tinyllama.Q4_K_M.gguf > out/meta/SIZE.txt
          split -b 400000000 -d -a 2 out/tinyllama.Q4_K_M.gguf out/parts/part-
          sha256sum out/parts/part-* > out/meta/PART_SHA256SUMS.txt
          ls -l out/parts
          cat out/meta/SHA256SUMS.txt
          cat out/meta/PART_SHA256SUMS.txt
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: full-gguf-part-00-${{ github.run_id }}
          path: out/parts/part-00
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: full-gguf-part-01-${{ github.run_id }}
          path: out/parts/part-01
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: full-gguf-meta-${{ github.run_id }}
          path: out/meta/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
