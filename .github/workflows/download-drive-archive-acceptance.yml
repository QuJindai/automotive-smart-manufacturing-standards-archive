name: Download Drive Archive Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/download-drive-archive-acceptance.yml'

permissions:
  contents: read

jobs:
  finalize-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Finalize dataset and browser fixtures from verified Drive files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request

          URL='https://ezvfqrhzucjvkwnnbjux.supabase.co/functions/v1/download-mcp-staging'
          fixtures=[
            ('download-datasetfixture', {
              'file_id':'11TqO2NKNLMeVJgbjs-k5dLlzgOGEwCVn',
              'name':'HF_demo1_train.csv','size':1446,
              'sha256':'676adb60715897e51ac08a54393575942e2df0e5a0b9687d5ca0b6c8113a995a',
              'web_url':'https://drive.google.com/file/d/11TqO2NKNLMeVJgbjs-k5dLlzgOGEwCVn/view'}),
            ('download-browserfixture', {
              'file_id':'1wlgaHonzVbam3ePpZCr-HruA3H2diga9',
              'name':'DHS_Resilient_PNT_Best_Practices_2025.pdf','size':1852036,
              'sha256':'37ab115abb3c6c580deef337844839641c0afe378068c8b07815b301c3d1f737',
              'web_url':'https://drive.google.com/file/d/1wlgaHonzVbam3ePpZCr-HruA3H2diga9/view'}),
            ('download-browserfixture2', {
              'file_id':'1Z5DJwxYWqqBsLI5DzavVQTQd5NqxPhtY',
              'name':'EU_2021_1228_BROWSER_ACCEPTANCE.pdf','size':19463308,
              'sha256':'58811d8069e3d019d8293c8c0bcbd5f470c89a9dca9608e59be5f51639fdf870',
              'web_url':'https://drive.google.com/file/d/1Z5DJwxYWqqBsLI5DzavVQTQd5NqxPhtY/view'}),
          ]

          def call(tool,args,ident):
              payload={'jsonrpc':'2.0','id':ident,'method':'tools/call','params':{'name':tool,'arguments':args}}
              req=urllib.request.Request(URL,data=json.dumps(payload,separators=(',',':')).encode(),headers={'content-type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as r:
                  body=json.load(r)
              result=body['result']
              if result.get('isError'):
                  raise RuntimeError(f'{tool} failed: {result}')
              return result['structuredContent']

          for idx,(download_id,ref) in enumerate(fixtures,1):
              s=call('resume_download',{'download_id':download_id,'result':{'type':'drive_archive_result','drive_refs':[ref]}},idx*10+1)
              assert s['status']=='DRIVE_VERIFYING', (download_id,s)
              s=call('resume_download',{'download_id':download_id,'result':{'type':'drive_verify_result','verified':True}},idx*10+2)
              assert s['drive_verified'] is True, (download_id,s)
              s=call('finalize_download',{'download_id':download_id},idx*10+3)
              assert s['status']=='COMPLETED' and s['failed_files']==[], (download_id,s)
              print('DRIVE_FIXTURE_COMPLETED',download_id,ref['size'],ref['sha256'])
          print('DOWNLOAD_DRIVE_MULTIFIXTURE=PASS')
          PY
